name: Unit Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '14.x'
      - name: Install npm dependencies
        run: yarn install
      - name: Unit tests
        run: yarn workspace oxd-components test:unit
